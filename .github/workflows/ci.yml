name: Build and container
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Trading212Mcp.sln --configuration Release --verbosity minimal
      - name: Validate Portainer Compose template
        env:
          MCP_IMAGE: ghcr.io/example/trading212-mcp:v0.1.0
          MCP_HOST: trading212-pi.example.internal
          PI_BIND_IP: 192.0.2.10
          PI_SECRET_DIR: /opt/trading212-mcp/secrets
          PI_CONFIG_DIR: /opt/trading212-mcp/config
          PI_TLS_DIR: /opt/trading212-mcp/tls
        run: docker compose config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
